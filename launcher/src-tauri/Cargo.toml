[package]
name = "majistic-launcher"
version = "0.1.2"
description = "Majistic Recomp Launcher"
authors = ["Majistic Recomp Team"]
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "majistic_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
dev-mode = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-updater = "2"
flate2 = { version = "1.0", features = ["rust_backend"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Foundation",
] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
