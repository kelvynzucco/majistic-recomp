# Diagnostic and gameplay mid-asm hooks (ported from ArthurMS15/MajinRecomp)

# Presentation interval & frame timing
[[midasm_hook]]
address = 0x82162360
name = "Majin_FrameDt"
registers = ["f0"]
after_instruction = false

# Character move (sub_82344F98): root-motion target at r1+0x58..0x60, character in r28.
# Scaled up when the character was blocked last frame to allow climbing small edges at 60+ FPS.
[[midasm_hook]]
address = 0x823450A4
name = "Majin_MoveStep"
registers = ["r1", "r28"]
after_instruction = false

# Field of view (camera_fov.cpp): scaling camera FOV (+0x268) for culling and projection.
[[midasm_hook]]
address = 0x829FC7B8
name = "Majin_FovFrustumA"
registers = ["f0"]
after_instruction = true

[[midasm_hook]]
address = 0x829FC7DC
name = "Majin_FovFrustumB"
registers = ["f12"]
after_instruction = true

[[midasm_hook]]
address = 0x829FD4A8
name = "Majin_FovProjection"
registers = ["f13"]
after_instruction = true

[[midasm_hook]]
address = 0x829FE30C
name = "Majin_FovProjection"
registers = ["f13"]
after_instruction = true

# Post effect switches (post_effects.cpp): r11 = effect enabled flag in sub_821A00E0.
[[midasm_hook]]
address = 0x821A0530
name = "Majin_PauseBlurEnabled"
registers = ["r11"]
after_instruction = false

[[midasm_hook]]
address = 0x821A0578
name = "Majin_DofEnabled"
registers = ["r11"]
after_instruction = false

[[midasm_hook]]
address = 0x821A05E4
name = "Majin_BloomEnabled"
registers = ["r11"]
after_instruction = false

# Partial animations (anim_speed.cpp): sub_822BBEB8 advances sub-motion slots (expressions, gestures).
[[midasm_hook]]
address = 0x822BC1A4
name = "Majin_SubMotionStep"
registers = ["f13"]
after_instruction = false

[[midasm_hook]]
address = 0x822BC23C
name = "Majin_SubMotionStep"
registers = ["f0"]
after_instruction = false

# World object animations (anim_speed.cpp): sub_822421C8 and sub_822BCE90.
[[midasm_hook]]
address = 0x822421E4
name = "Majin_ObjectMotionStepBegin"
registers = ["r31"]
after_instruction = false

[[midasm_hook]]
address = 0x822BCED4
name = "Majin_MotionStepTime"
registers = ["f12"]
after_instruction = false

[[midasm_hook]]
address = 0x822BCEFC
name = "Majin_MotionStepTotal"
registers = ["f13"]
after_instruction = false
